services:
  world:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PUBLISH_HOST:-0.0.0.0}:${PUBLISH_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/data/world.db
      STORAGE_DIR: /app/storage
      WEB_DIST_DIR: /app/apps/web/dist
      ASSET_SECRET: "${ASSET_SECRET:?Run node --experimental-strip-types scripts/init.mts --config-only first}"
      RUST_LOG: info
      AUTO_BACKUP_HOURS: "${AUTO_BACKUP_HOURS:-24}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    volumes:
      - world-data:/app/data
      - world-storage:/app/storage
    stop_grace_period: 20s

volumes:
  world-data:
  world-storage:
